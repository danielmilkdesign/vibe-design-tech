<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIBE — Site com Tags (genérico)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet" />
<style>
  :root {
    --cy: #00d2f6; --cy-hi: #7af0ff;
    --lime: #dced47; --lime-hi: #f2ff82;
  }
  html, body { margin: 0; padding: 0; background: transparent; width: 100%; height: 100%; }
  body {
    display: grid; place-items: center;
    width: 100%; height: 100%; overflow: hidden;
  }

  /* palco: mesma proporção da arte original (2176 x 1632) */
  .wrap {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 1088px;
    aspect-ratio: 1760 / 1328;
    user-select: none; -webkit-user-select: none;
  }
  .scene { position: absolute; inset: 0; perspective: 160cqw; perspective-origin: 50% 45%; }
  .stage {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transform: translateY(calc(var(--bob, 0) * 1cqw)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(.97);
    will-change: transform;
  }

  /* camada 0: mockup + destaques */
  .mock { position: absolute; inset: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .mock img { filter: drop-shadow(0 1.6cqw 2.4cqw rgba(8,20,30,.28)); position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  .mock svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hit { fill: transparent; pointer-events: all; }

  .dim { fill: #020a0e; fill-opacity: .5; fill-rule: evenodd; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
  .hl { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  .hl .glow { fill: rgba(0,210,246,.07); stroke: none; }
  .hl .edge {
    fill: none; stroke: var(--cy); stroke-width: 5; stroke-linejoin: round;
    stroke-dasharray: 40 24;
    filter: drop-shadow(0 0 7px rgba(0,210,246,.95));
  }
  .hl.lime .glow { fill: rgba(220,237,71,.08); }
  .hl.lime .edge { stroke: var(--lime); filter: drop-shadow(0 0 7px rgba(220,237,71,.9)); }
  .glare { pointer-events: none; }

  /* camada 1: conexões e tags (levemente à frente, para o paralaxe) */
  .plane {
    position: absolute; inset: 0; pointer-events: none; transform-style: preserve-3d;
    transform: translateZ(3cqw) scale(.984375);
  }
  .plane > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ln {
    fill: none; stroke: var(--cy); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 1 2;
    animation: draw .8s cubic-bezier(.4,0,.2,1) both; animation-delay: var(--d);
    filter: drop-shadow(0 0 6px rgba(0,210,246,.55));
    transition: stroke .3s ease, stroke-width .3s ease;
  }
  .pulse {
    fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: .07 1; stroke-dashoffset: .07; opacity: 0;
    filter: drop-shadow(0 0 8px rgba(122,240,255,1));
    transition: opacity .3s ease;
  }
  .pt { fill: var(--cy); filter: drop-shadow(0 0 8px rgba(0,210,246,.9)); animation: pop .5s cubic-bezier(.2,.9,.3,1.4) backwards; animation-delay: calc(var(--d) + .5s); transform-box: fill-box; transform-origin: center; }
  .ring { fill: none; stroke: var(--cy-hi); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }

  .tag {
    position: absolute; padding: 0; margin: 0; border: 0; background: none;
    font: inherit; color: inherit; cursor: pointer; pointer-events: auto;
    -webkit-tap-highlight-color: transparent; outline: none;
    transition: transform .4s cubic-bezier(.2,.9,.25,1.25);
    animation: pop .65s cubic-bezier(.2,.9,.3,1.3) backwards; animation-delay: var(--d);
  }
  .tag-body {
    position: absolute; inset: 0; box-sizing: border-box; border-radius: 999px;
    border: calc(var(--u) * 4) solid var(--c);
    background: linear-gradient(180deg, #0b242c 0%, #061a21 100%);
    box-shadow: 0 0 calc(var(--u) * 28) rgba(var(--rgb), .30), inset 0 0 calc(var(--u) * 22) rgba(var(--rgb), .06);
    transition: box-shadow .3s ease, border-color .3s ease, background .3s ease;
    animation: float var(--fd) ease-in-out infinite; animation-delay: var(--fdl);
  }
  .c-cy   { --c: var(--cy);   --hi: var(--cy-hi);   --rgb: 0,210,246;  }
  .c-lime { --c: var(--lime); --hi: var(--lime-hi); --rgb: 220,237,71; }
  .wrap { --u: calc(100cqw / 1760); }
  .label {
    position: absolute; top: 50%; left: calc(var(--lx) * 1%);
    transform: translate(-50%, -50%);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 800;
    font-size: calc(var(--u) * var(--fs, 44)); line-height: 1; letter-spacing: .03em;
    color: var(--c); white-space: nowrap;
    transition: text-shadow .3s ease, color .3s ease;
  }
  .dot {
    position: absolute; top: 50%; left: calc(var(--u) * (var(--dx) - 4));
    width: calc(var(--u) * 30); height: calc(var(--u) * 30);
    margin: calc(var(--u) * -15) 0 0 calc(var(--u) * -15);
    border-radius: 50%; background: var(--c);
    box-shadow: 0 0 calc(var(--u) * 16) rgba(var(--rgb), .85);
    animation: breathe 3.4s ease-in-out infinite;
  }
  .dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: calc(var(--u) * 3) solid var(--hi); opacity: 0;
  }
  .tag:focus-visible .tag-body { outline: calc(var(--u) * 4) solid #fff; outline-offset: calc(var(--u) * 6); }
  
  /* estados ativos (hover/foco/toque em tag ou na região correspondente) */
  .wrap[data-active="site"]   .tag-site,
  .wrap[data-active="method"] .tag-method,
  .wrap[data-active="prova"]  .tag-prova,
  .wrap[data-active="agenda"] .tag-agenda,
  .tag:hover { transform: translateZ(1.6cqw) scale(1.06); }
  .wrap[data-active="site"]   .tag-site   .tag-body,
  .wrap[data-active="method"] .tag-method .tag-body,
  .wrap[data-active="prova"]  .tag-prova  .tag-body,
  .wrap[data-active="agenda"] .tag-agenda .tag-body {
    border-color: var(--hi);
    background: linear-gradient(180deg, #0e2f39 0%, #08222b 100%);
    box-shadow: 0 0 calc(var(--u) * 52) rgba(var(--rgb), .62), inset 0 0 calc(var(--u) * 34) rgba(var(--rgb), .18);
  }
  .wrap[data-active="site"]   .tag-site   .label,
  .wrap[data-active="method"] .tag-method .label,
  .wrap[data-active="prova"]  .tag-prova  .label,
  .wrap[data-active="agenda"] .tag-agenda .label { color: var(--hi); text-shadow: 0 0 calc(var(--u) * 18) rgba(var(--rgb), .8); }
  .wrap[data-active="site"]   .tag-site   .dot::after,
  .wrap[data-active="method"] .tag-method .dot::after,
  .wrap[data-active="prova"]  .tag-prova  .dot::after,
  .wrap[data-active="agenda"] .tag-agenda .dot::after { animation: ping 1s ease-out infinite; }

  .wrap[data-active="site"]   .hl-site,
  .wrap[data-active="method"] .hl-method,
  .wrap[data-active="prova"]  .hl-ba,
  .wrap[data-active="prova"]  .hl-review,
  .wrap[data-active="agenda"] .hl-bar { opacity: 1; }
  .wrap[data-active="site"]   .hl-site .edge,
  .wrap[data-active="method"] .hl-method .edge,
  .wrap[data-active="prova"]  .hl-ba .edge,
  .wrap[data-active="prova"]  .hl-review .edge,
  .wrap[data-active="agenda"] .hl-bar .edge { animation: march 1.1s linear infinite; }
  .wrap[data-active="method"] .dim-method,
  .wrap[data-active="prova"]  .dim-prova,
  .wrap[data-active="agenda"] .dim-agenda { opacity: 1; }

  .wrap[data-active="site"]   .ln-site,
  .wrap[data-active="method"] .ln-method,
  .wrap[data-active="prova"]  .ln-prova { stroke: var(--cy-hi); stroke-width: 8; }
  .wrap[data-active="site"]   .pulse-site,
  .wrap[data-active="method"] .pulse-method,
  .wrap[data-active="prova"]  .pulse-prova { opacity: 1; animation: travel 1s linear infinite; }
  .wrap[data-active="site"]   .ring-site,
  .wrap[data-active="method"] .ring-method,
  .wrap[data-active="prova"]  .ring-prova { animation: ping-svg 1s ease-out infinite; }

  @keyframes rise  { from { opacity: 0; transform: translateY(3%) scale(.965); } to { opacity: 1; transform: none; } }
  @keyframes pop   { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  @keyframes draw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(.12cqw,-.34cqw); } }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 calc(var(--u) * 12) rgba(var(--rgb), .6); } 50% { box-shadow: 0 0 calc(var(--u) * 24) rgba(var(--rgb), 1); } }
  @keyframes ping  { from { transform: scale(1); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
  @keyframes ping-svg { from { transform: scale(1); opacity: .95; } to { transform: scale(3); opacity: 0; } }
  @keyframes march { to { stroke-dashoffset: -64; } }
  @keyframes travel { from { stroke-dashoffset: .07; } to { stroke-dashoffset: -1; } }

  @media (prefers-reduced-motion: reduce) {
    .mock, .ln, .pt, .tag, .tag-body, .dot { animation: none !important; }
    .hl .edge, .pulse, .ring, .dot::after { animation: none !important; }
  }
</style>
</head>

<script>
(function () {
  var wrap = document.getElementById('wrap');
  var glare = document.getElementById('gl');
  var glareRect = document.getElementById('glare');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* --- estado ativo: tag <-> região do mockup --- */
  var pinned = null, lastType = 'mouse';
  function show(k) { wrap.setAttribute('data-active', k); }
  function hide() { if (pinned) show(pinned); else wrap.removeAttribute('data-active'); }
  function bind(el) {
    var k = el.getAttribute('data-key');
    el.addEventListener('pointerenter', function (e) { lastType = e.pointerType; if (e.pointerType !== 'touch') show(k); });
    el.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') hide(); });
    el.addEventListener('click', function () {
      if (lastType === 'touch') { pinned = (pinned === k) ? null : k; pinned ? show(k) : hide(); }
    });
    if (el.tagName === 'BUTTON') {
      el.addEventListener('focus', function () { show(k); });
      el.addEventListener('blur', function () { hide(); });
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tag, .hit'), bind);
  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch' && !e.target.closest('.tag') && !(e.target.classList && e.target.classList.contains('hit'))) {
      pinned = null; hide();
    }
  });

  if (reduce) return;

  /* --- movimento: inclinação 3D acompanhando o cursor + deriva suave em repouso --- */
  var tx = 0, ty = 0, cx = 0, cy = 0, gx = 880, gy = 571, hasPointer = false;
  var t0 = performance.now();
  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    var r = wrap.getBoundingClientRect();
    tx = Math.max(-1.3, Math.min(1.3, ((e.clientX - r.left) / r.width - .5) * 2));
    ty = Math.max(-1.3, Math.min(1.3, ((e.clientY - r.top) / r.height - .5) * 2));
    hasPointer = true;
  });
  document.documentElement.addEventListener('pointerleave', function () { hasPointer = false; });

  function frame(now) {
    var t = now - t0;
    var idleX = Math.sin(t / 2600) * .38, idleY = Math.cos(t / 3300) * .30;
    var targetX = hasPointer ? tx : idleX;
    var targetY = hasPointer ? ty : idleY;
    cx += (targetX - cx) * .075;
    cy += (targetY - cy) * .075;
    wrap.style.setProperty('--ry', (cx * 9).toFixed(3) + 'deg');
    wrap.style.setProperty('--rx', (-cy * 6).toFixed(3) + 'deg');
    wrap.style.setProperty('--bob', (Math.sin(t / 1900) * .35).toFixed(3));
    var gtx = hasPointer ? (tx * .5 + .5) * 1760 : 880 + Math.sin(t / 2200) * 422;
    var gty = hasPointer ? (ty * .5 + .5) * 1328 : 584 + Math.cos(t / 2900) * 239;
    gx += (gtx - gx) * .08; gy += (gty - gy) * .08;
    glare.setAttribute('cx', gx.toFixed(1));
    glare.setAttribute('cy', gy.toFixed(1));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
